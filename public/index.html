<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fault-Tolerant Data Ingestion</title>

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 20px;
      max-width: 1100px;
    }

    h1, h2 {
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 140px;
      font-family: monospace;
      font-size: 14px;
    }

    button {
      padding: 8px 14px;
      margin-top: 8px;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      flex: 1;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid #eee;
      padding: 6px;
      text-align: left;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>
  <h1>Fault-Tolerant Data Processing System</h1>
  <p class="muted">
    Manual event submission, failure simulation, and live aggregation view
  </p>

  <!-- Event Submission -->
  <section>
    <h2>Submit Raw Event</h2>

    <label>
      <input type="checkbox" id="simulateFailure" />
      Simulate Database Failure
    </label>

    <textarea id="eventInput">
{
  "source": "client_A",
  "payload": {
    "metric": "sales",
    "amount": "1200",
    "timestamp": "2024/01/01"
  }
}
    </textarea>

    <br />
    <button onclick="submitEvent()">Submit Event</button>
    <span id="submitResult" class="muted"></span>
  </section>

  <!-- Events View -->
  <div class="row">
    <div class="card">
      <h2>Processed Events</h2>
      <div id="processedEvents">Loading...</div>
    </div>

    <div class="card">
      <h2>Failed Events</h2>
      <div id="failedEvents">Loading...</div>
    </div>
  </div>

  <!-- Aggregates -->
  <section style="margin-top: 20px;">
    <h2>Aggregated Results</h2>
    <button onclick="loadAggregates()">Refresh Aggregates</button>
    <div id="aggregates">Loading...</div>
  </section>

  <script src="app.js"></script>
</body>
</html>
